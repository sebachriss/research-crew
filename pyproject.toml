[project]
name = "research-crew"
version = "0.1.0"
requires-python = ">=3.11"
description = "Multi-agent research system with LangGraph"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
